<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - ChatApp</title></head>
<body style="font-family:system-ui,sans-serif;padding:2rem;max-width:360px">
  <h2>Login to ChatApp</h2>
  <p><input id="email" type="email" placeholder="Email" style="width:100%"></p>
  <p><input id="password" type="password" placeholder="Password" style="width:100%"></p>
  <button id="login">Login</button> <a href="/register.html">Register</a>
  <p id="err" style="color:red"></p>
<script>
document.getElementById('login').onclick = async () => {
  const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
  const data = await res.json();
  if (res.ok) location.href = '/app.html'; else document.getElementById('err').textContent = data.error;
};
</script></body></html>
