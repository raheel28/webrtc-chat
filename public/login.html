<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - ChatApp</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main class="auth">
  <form class="card" id="loginForm">
    <h1>ChatApp</h1>
    <p class="sub">Log in to chat one-to-one or in rooms.</p>
    <label class="field">Email<input id="email" type="email" autocomplete="email" required></label>
    <label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" id="login">Log in</button>
    <p class="err" id="err"></p>
    <p class="switch">No account? <a href="/register.html">Create one</a></p>
  </form>
</main>
<script>
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
  const data = await res.json();
  if (res.ok) location.href = '/app.html'; else document.getElementById('err').textContent = data.error;
};
</script></body></html>
