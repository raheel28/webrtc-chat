<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatApp</title>
<link rel="stylesheet" href="/style.css">
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="me-box"><h3 id="me"></h3><button id="logout">Log out</button></div>
    <h4>People</h4><ul id="users"></ul>
    <h4>Rooms</h4><ul id="rooms"></ul>
  </aside>
  <main id="main">
    <div id="status">Pick a person (peer-to-peer) or a room (via server).</div>
    <div id="msgs"></div>
    <form id="form">
      <input id="input" placeholder="Type a message" autocomplete="off" disabled>
      <input id="file" type="file" disabled title="Attach a file (5 MB max)">
      <button>Send</button>
    </form>
  </main>
</div>
<script src="/app.js"></script>
</body></html>
