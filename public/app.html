<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatApp</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  body{font-family:system-ui,sans-serif;margin:0;display:flex;height:100vh}
  #side{width:230px;border-right:2px solid #000;padding:1rem;box-sizing:border-box;overflow-y:auto}
  #main{flex:1;display:flex;flex-direction:column;padding:1rem;box-sizing:border-box;min-width:0}
  ul{padding-left:0} li{list-style:none;cursor:pointer;padding:3px 0} li:hover{font-weight:bold}
  .on{color:green}.off{color:#c33}
  #status{color:#666;margin-bottom:.5rem}
  #msgs{flex:1;overflow-y:auto;border:1px solid #ddd;padding:.5rem;margin-bottom:.5rem}
  #msgs p{margin:.25rem 0;word-wrap:break-word}.sys{color:#999;font-style:italic}
  .tick{color:#c33}.tick.read{color:green}
</style></head>
<body>
<div id="side">
  <h3 id="me"></h3><button id="logout">Log out</button>
  <h4>People <small>(green = online)</small></h4><ul id="users"></ul>
  <h4>Rooms</h4><ul id="rooms"></ul>
</div>
<div id="main">
  <div id="status">Pick a person (peer-to-peer) or a room (via server).</div>
  <div id="msgs"></div>
  <form id="form">
    <input id="input" placeholder="Enter message" autocomplete="off" disabled>
    <input id="file" type="file" disabled>
    <button>Send</button>
  </form>
</div>
<script src="/app.js"></script>
</body></html>
