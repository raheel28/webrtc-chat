# Render blueprint: the chat app plus a PostgreSQL database.
# JWT_SECRET is generated by Render; DATABASE_URL is wired from the database automatically.
databases:
  - name: webrtc-chat-db
    plan: free            # note: Render's free Postgres expires after a limited time; upgrade to keep data
    databaseName: chatapp
    user: chatapp

services:
  - type: web
    name: webrtc-chat
    runtime: node
    plan: free            # sleeps after 15 min idle; "starter" stays awake
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /login.html
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: webrtc-chat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
